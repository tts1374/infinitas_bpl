name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile (`quick` or `full`)
        type: choice
        required: true
        default: quick
        options:
          - quick
          - full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'quick' || github.event_name == 'push' && 'full' || github.event.inputs.profile }}
