[package]
name = "infinitas-bpl-client"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "infinitas_bpl_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2" }

[build-dependencies]
tauri-build = { version = "2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
