model = "gpt-5.4"

[agents]
max_threads = 6
max_depth = 2

################################################################################
# MCP servers (minimal set for infinitas_arena)
################################################################################

[mcp_servers]

# GitHub MCP is intentionally user-local.
# Configure it in ~/.codex/config.toml (or via `codex mcp add`) so PAT wiring stays out of repo config.

# Cloudflare Workers Bindings MCP (remote)
[mcp_servers.cloudflareBindings]
# Keep Bindings on mcp-remote so Cloudflare remote MCP auth/transport matches Observability.
command = "npx"
args = ["-y", "mcp-remote@latest", "https://bindings.mcp.cloudflare.com/mcp"]
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0

# Cloudflare Observability MCP is intentionally user-local.
# Configure it in ~/.codex/config.toml with an account API token so OAuth loops stay out of repo config.

# Playwright MCP (UI regression support)
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--isolated"]
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0
